apiVersion: eksctl.io/v1alpha5 # eks olusturma cli komutu yerine, yaml dosyasi ile cluster olusturacagiz bununla. Bunu jenkinsde calistircaz. Suan dosyalama yaptik.
kind: ClusterConfig

metadata:
  name: petclinic-cluster
  region: us-east-1
availabilityZones: ["us-east-1a", "us-east-1b", "us-east-1c"]
managedNodeGroups:
  - name: ng-1
    instanceType: t3a.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false